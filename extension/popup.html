<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Roja Popup Blocker</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon48.png" width="36" height="36" alt="">
        <div>
          <h1>Roja Popup Blocker</h1>
          <p id="host">Seite wird geprüft …</p>
        </div>
      </header>

      <section class="status-card">
        <div>
          <strong id="status">Wird geladen …</strong>
          <span id="explanation"></span>
        </div>
        <label class="switch" aria-label="Schutz auf dieser Seite umschalten">
          <input id="enabled" type="checkbox">
          <span class="slider"></span>
        </label>
      </section>

      <p class="counter"><strong id="blocked">0</strong> Seitenelemente/Popups blockiert</p>
      <p class="hint">Nach dem ersten Installieren bereits geöffnete Seiten einmal neu laden.</p>
    </main>
    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
